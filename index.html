<body>
<style>
/* Layout: one-column phone app, stacked cards under a sticky header, fixed bottom tab bar with a center "log" button. Time-card motif: perforated card headers, hours as the second currency. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#E2E7EE; --ink:#142033; --muted:#5A6678; --line:#D2D9E3;
  --accent:#E38A22; --accent-soft:#FBE7CC; --accent-ink:#6E3B00;
  --save:#16806A; --save-soft:#D3EFE7; --want:#C4435A; --want-soft:#F8DDE2; --need:#3A6CB3; --need-soft:#DCE6F5; --debt:#7A5BB8; --debt-soft:#E7E0F5;
  --shadow:0 1px 0 rgba(20,32,51,.04),0 6px 18px -8px rgba(20,32,51,.18);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C131E; --surface:#152032; --surface-2:#1D2A3F; --ink:#E7ECF4; --muted:#93A0B4; --line:#283651;
  --accent:#F2A541; --accent-soft:#3A2A14; --accent-ink:#FFD7A0;
  --save:#3CC39E; --save-soft:#143A33; --want:#EE6F84; --want-soft:#3D1D27; --need:#7CA7EA; --need-soft:#1A2B47; --debt:#AE93EC; --debt-soft:#2A2244;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 22px -10px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C131E; --surface:#152032; --surface-2:#1D2A3F; --ink:#E7ECF4; --muted:#93A0B4; --line:#283651;
  --accent:#F2A541; --accent-soft:#3A2A14; --accent-ink:#FFD7A0;
  --save:#3CC39E; --save-soft:#143A33; --want:#EE6F84; --want-soft:#3D1D27; --need:#7CA7EA; --need-soft:#1A2B47; --debt:#AE93EC; --debt-soft:#2A2244;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 22px -10px rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:26px;font-weight:800}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;transform:translateY(-2px)}
.sync{font-size:11px;color:var(--muted);letter-spacing:.04em;border:0;background:var(--surface-2);border-radius:999px;padding:3px 8px;cursor:pointer;font-weight:600}
.sync.bad{background:var(--want-soft);color:var(--want)}
.plan-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.plan-row .meter{grid-column:1/-1;height:6px}
.plan-row b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-row span{font-family:var(--f-mono);font-size:12.5px;font-weight:700}
textarea{width:100%;min-height:90px;background:var(--surface-2);border:1.5px solid transparent;border-radius:11px;padding:10px;font:13px/1.4 var(--f-mono);color:var(--ink)}
.streak{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 9px;font-weight:700;box-shadow:var(--shadow)}
.flame{width:18px;height:22px;transform-origin:50% 90%}
.streak.on .flame{animation:flick 1.6s ease-in-out infinite}
.streak .ct{font-family:var(--f-mono);font-size:15px}
.streak .fz{font-size:11px;color:var(--need);font-weight:600}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}40%{transform:scale(1.08,.95) rotate(2deg)}70%{transform:scale(.96,1.06) rotate(-1deg)}}

.sample-bar{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;font-weight:600}
.sample-bar button{flex:none}
.sample-bar.warn{background:var(--want-soft);color:var(--want);align-items:flex-start}

.screen{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.card h2{font-size:18px;font-weight:700}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}

/* time card hero */
.timecard{position:relative;overflow:hidden;padding-top:26px}
.timecard::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:var(--surface-2);
  -webkit-mask:radial-gradient(circle at 10px 7px,transparent 3.2px,#000 3.6px) 0 0/20px 14px;mask:radial-gradient(circle at 10px 7px,transparent 3.2px,#000 3.6px) 0 0/20px 14px}
.hero{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .big.over{color:var(--want)}
.hero .hrs{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:4px 8px}
.ring{width:96px;height:96px}
.ring circle{fill:none;stroke-width:10}
.ring .trk{stroke:var(--surface-2)}
.ring .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1),stroke .3s;transform:rotate(-90deg);transform-origin:50% 50%}
.ring .val.over{stroke:var(--want)}
.ring text{font-family:var(--f-mono);font-size:15px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.ring .lbl{font-family:var(--f-body);font-size:9px;font-weight:600;fill:var(--muted);letter-spacing:.08em}

.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2);gap:2px;margin-top:16px}
.split i{display:block;height:100%;transition:flex-grow .8s cubic-bezier(.2,.8,.2,1)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin-top:10px;font-size:12.5px}
.legend span{display:flex;align-items:center;gap:6px;min-width:0}
.legend b{font-family:var(--f-mono);font-weight:700;margin-left:auto;font-size:12px}
.sw{width:9px;height:9px;border-radius:3px;flex:none}

/* wage + hours */
.wage{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.wage .rate{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.02em}
.wage .rate small{font-size:15px;font-weight:600;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px}
.stepper button{width:38px;height:38px;border:0;border-radius:9px;background:var(--surface);font-size:20px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.stepper button:active{transform:scale(.92)}
.stepper .v{min-width:54px;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:17px}
.stepper .v small{display:block;font-family:var(--f-body);font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* nudge */
.nudge{display:flex;gap:12px;align-items:center;background:var(--need-soft);border-color:transparent}
.nudge .t{flex:1;min-width:0}
.nudge strong{display:block}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;background:var(--surface-2);color:var(--ink);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--ink);color:var(--surface)}
.btn.accent{background:var(--accent);color:#2A1600}
.btn.save{background:var(--save);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--want);color:#fff}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

/* fun tax */
.funtax{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.coin{width:44px;height:44px;border-radius:50%;background:var(--save-soft);color:var(--save);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:18px}
.funtax .amt{font-family:var(--f-mono);font-weight:700;font-size:20px}

/* week review bars */
.bars{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.bar{display:grid;grid-template-columns:96px 1fr 76px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .fl{height:100%;border-radius:5px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar .v{text-align:right;font-family:var(--f-mono);font-weight:700;font-size:12.5px}

/* tx list */
.tx{display:flex;flex-direction:column}
.txr{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.txr:first-child{border-top:0}
.tag{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.02em}
.tag.need{background:var(--need-soft);color:var(--need)}
.tag.want{background:var(--want-soft);color:var(--want)}
.txr .nm{min-width:0;overflow:hidden}
.txr .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txr .nm span{font-size:12px;color:var(--muted)}
.txr .r{text-align:right;display:flex;align-items:center;gap:8px}
.txr .a{font-family:var(--f-mono);font-weight:700}
.txr .h{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.x{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}
.x.confirm{background:var(--want);color:#fff;width:auto;padding:0 10px;font-size:12px;font-weight:700}
.empty{padding:18px 4px;text-align:center;color:var(--muted);font-size:14px}

/* badges */
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.badge .md{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:2px dashed var(--line);font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--muted)}
.badge.got{color:var(--ink)}
.badge.got .md{border:0;background:var(--accent);color:#2A1600;box-shadow:0 0 0 4px var(--accent-soft)}

/* debt */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface-2);border-radius:12px;padding:12px;min-width:0}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin-top:2px}
.kpi .v.good{color:var(--save)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.range{width:100%;accent-color:var(--accent);height:28px}
.debt{display:flex;flex-direction:column;gap:10px}
.debt .hd{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
.ord{width:28px;height:28px;border-radius:8px;background:var(--debt-soft);color:var(--debt);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:13px}
.debt .bal{font-family:var(--f-mono);font-weight:700;font-size:17px;text-align:right}
.meter{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--debt);border-radius:6px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.debt.paid .meter i{background:var(--save)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;background:var(--surface-2);border-radius:999px;padding:4px 10px;color:var(--muted)}
.chip.good{background:var(--save-soft);color:var(--save)}
.inline{display:flex;gap:8px}
.tgt{margin-top:12px;background:var(--debt-soft);border-radius:14px;padding:14px}
.tgt .kpi{background:var(--surface)}
.tgt-big{display:flex;flex-direction:column}
.tgt-big .mono{font-family:var(--f-display);font-weight:800;font-size:38px;letter-spacing:-.03em;line-height:1.05;color:var(--ink)}
.tgt-big small{color:var(--muted);font-weight:600;font-size:13px}
.tgt .plan-row{border-color:color-mix(in srgb,var(--debt) 25%,transparent)}
.fund{display:flex;flex-direction:column;gap:8px;background:var(--save-soft);border-radius:12px;padding:12px}
.fund .meter{background:var(--surface)}
.fund .inline input{background:var(--surface)}
.inline input{flex:1;min-width:0}

/* goals jar */
.goal{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center}
.jar{position:relative;width:76px;height:96px;border-radius:14px 14px 18px 18px;border:3px solid var(--line);overflow:hidden;background:var(--surface-2)}
.jar::before{content:"";position:absolute;left:12px;right:12px;top:-3px;height:9px;background:var(--line);border-radius:0 0 4px 4px;z-index:2}
.jar .fill{position:absolute;left:0;right:0;bottom:0;background:var(--save);transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
.jar .wave{position:absolute;left:-50%;width:200%;height:14px;top:-10px;background:radial-gradient(14px 8px at 50% 100%,var(--save) 98%,transparent) 0 0/28px 14px repeat-x;animation:wave 2.4s linear infinite}
.jar .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:15px;z-index:3;color:var(--ink);text-shadow:0 0 6px var(--surface)}
@keyframes wave{to{transform:translateX(28px)}}
.goal .g h3{font-size:17px}
.goal .g .money{font-family:var(--f-mono);font-weight:700;margin-top:2px}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.field input,.field select,.inline input{width:100%;background:var(--surface-2);border:1.5px solid transparent;border-radius:11px;padding:11px 12px;font-size:16px;min-width:0}
.field input:focus,.field select:focus,.inline input:focus{outline:none;border-color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.switch input{width:46px;height:28px;accent-color:var(--save)}
.tax{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.tax .tl{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.tax .tl b{font-family:var(--f-mono);font-weight:700}
.tax .tl.tot{border-bottom:0;padding-top:10px;font-weight:700;font-size:15px}
.tax .tl.tot b{color:var(--save)}
details summary{cursor:pointer;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";float:right;font-family:var(--f-mono);color:var(--muted)}
details[open] summary::after{content:"−"}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:520px;margin:0 auto;height:var(--tabh);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;padding:6px 0}
.tabs button svg{width:23px;height:23px}
.tabs button.on{color:var(--ink)}
.tabs button.on svg{color:var(--accent)}
.fab{width:58px!important;height:58px;border-radius:18px!important;background:var(--ink)!important;color:var(--surface)!important;margin:-26px auto 0;box-shadow:0 10px 24px -8px rgba(20,32,51,.55);justify-self:center;transition:transform .15s}
.fab svg{width:28px!important;height:28px!important;color:var(--surface)!important}
.fab:active{transform:scale(.92)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,20,.45);z-index:40;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);max-height:92%;overflow:auto}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.amt-in{display:flex;align-items:center;justify-content:center;gap:4px;margin:6px 0 4px}
.amt-in span{font-family:var(--f-display);font-size:40px;font-weight:800;color:var(--muted)}
.amt-in input{font-family:var(--f-display);font-size:52px;font-weight:800;border:0;background:transparent;width:6.2ch;text-align:left;outline:none;letter-spacing:-.03em;font-variant-numeric:tabular-nums;padding:0}
.live-hrs{text-align:center;font-family:var(--f-mono);font-weight:700;font-size:14px;color:var(--accent-ink);min-height:22px}
.cats{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.cats .grp{display:flex;flex-wrap:wrap;gap:7px}
.cat{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 12px;font-weight:600;font-size:13.5px;cursor:pointer}
.cat.need.on{background:var(--need);border-color:var(--need);color:#fff}
.cat.want.on{background:var(--want);border-color:var(--want);color:#fff}
.cat:active{transform:scale(.95)}

/* toast + stamp + confetti */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:60;transform:translate(-50%,-140%);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.9,.25,1.2);max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.stamp{position:fixed;left:50%;top:42%;z-index:55;pointer-events:none;font-family:var(--f-mono);font-weight:700;font-size:30px;padding:10px 18px;border:4px solid currentColor;border-radius:10px;transform:translate(-50%,-50%) rotate(-8deg) scale(2.4);opacity:0;background:var(--surface)}
.stamp.go{animation:stamp 1.25s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(2.4)}18%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) rotate(-8deg) scale(.9)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:58;width:100%;height:100%}
.pop{animation:pop .5s cubic-bezier(.2,.9,.25,1.4)}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.fade-in{animation:fadein .35s ease both}
@keyframes fadein{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:370px){.hero .big{font-size:36px}.bar{grid-template-columns:80px 1fr 66px}}
</style>

<script>
/* ===== ENGINE (pure functions) ===== */
const FED = {
  single:{std:16100,br:[[12400,.10],[50400,.12],[105700,.22],[201775,.24],[256225,.32],[640600,.35],[Infinity,.37]],otCap:12500,otPhase:150000,addlMed:200000},
  mfj:{std:32200,br:[[24800,.10],[100800,.12],[211400,.22],[403550,.24],[512450,.32],[768700,.35],[Infinity,.37]],otCap:25000,otPhase:300000,addlMed:250000},
  hoh:{std:24150,br:[[17700,.10],[67450,.12],[105700,.22],[201750,.24],[256200,.32],[640600,.35],[Infinity,.37]],otCap:12500,otPhase:150000,addlMed:200000}
};
const SS_BASE = 184500;
// kind: none | flat (statutory flat rate) | est (approximate effective rate for a typical hourly earner; edit or calibrate)
const STATES = {
  AL:["Alabama","est",4.0],AK:["Alaska","none",0],AZ:["Arizona","flat",2.5],AR:["Arkansas","est",3.5],CA:["California","est",4.0],
  CO:["Colorado","flat",4.4],CT:["Connecticut","est",4.5],DE:["Delaware","est",4.5],DC:["District of Columbia","est",5.0],FL:["Florida","none",0],
  GA:["Georgia","flat",4.99,{ded:[12000,24000],ot:1750}],HI:["Hawaii","est",6.0],ID:["Idaho","flat",5.3],IL:["Illinois","flat",4.95],IN:["Indiana","flat",2.95],
  IA:["Iowa","flat",3.8],KS:["Kansas","est",4.5],KY:["Kentucky","flat",3.5],LA:["Louisiana","flat",3.0],ME:["Maine","est",5.5],
  MD:["Maryland","est",4.5],MA:["Massachusetts","flat",5.0],MI:["Michigan","flat",4.25],MN:["Minnesota","est",5.5],MS:["Mississippi","flat",4.0],
  MO:["Missouri","est",4.0],MT:["Montana","est",4.5],NE:["Nebraska","est",4.5],NV:["Nevada","none",0],NH:["New Hampshire","none",0],
  NJ:["New Jersey","est",3.5],NM:["New Mexico","est",3.5],NY:["New York","est",5.0],NC:["North Carolina","flat",3.99],ND:["North Dakota","est",1.5],
  OH:["Ohio","est",2.75],OK:["Oklahoma","est",4.0],OR:["Oregon","est",7.5],PA:["Pennsylvania","flat",3.07],RI:["Rhode Island","est",4.0],
  SC:["South Carolina","est",5.0],SD:["South Dakota","none",0],TN:["Tennessee","none",0],TX:["Texas","none",0],UT:["Utah","flat",4.5],
  VT:["Vermont","est",5.0],VA:["Virginia","est",5.0],WA:["Washington","none",0],WV:["West Virginia","est",4.0],WI:["Wisconsin","est",5.0],WY:["Wyoming","none",0]
};
const PERIODS = {weekly:52,biweekly:26,semimonthly:24,monthly:12};

function bracketTax(t, br){let tax=0,prev=0;for(const [top,r] of br){if(t>prev)tax+=(Math.min(t,top)-prev)*r;prev=top;if(t<=top)break}return tax}
function weeklyGross(wage,h){const reg=Math.min(h,40),ot=Math.max(h-40,0);return wage*reg+1.5*wage*ot}
function annualCalc(s,h){
  const wage=+s.wage||0, ot=Math.max(h-40,0);
  const gross=weeklyGross(wage,h)*52, otPay=1.5*wage*ot*52, otPremium=.5*wage*ot*52;
  const periods=PERIODS[s.payFreq]||26, f=FED[s.filing]||FED.single;
  const k401=gross*(+s.k401Pct||0)/100, ins=Math.min((+s.insurance||0)*periods,gross);
  const agi=Math.max(0,gross-k401-ins);
  let otDed=Math.min(otPremium,f.otCap);
  if(agi>f.otPhase)otDed=Math.max(0,otDed-Math.ceil((agi-f.otPhase)/1000)*100);
  const fedTaxable=Math.max(0,agi-f.std-otDed), federal=bracketTax(fedTaxable,f.br);
  const ficaW=Math.max(0,gross-ins), ss=Math.min(ficaW,SS_BASE)*.062, med=ficaW*.0145+Math.max(0,ficaW-f.addlMed)*.009;
  const st=STATES[s.state]||STATES.GA, extra=st[3]||{};
  const stRate=(s.stateRate!==null&&s.stateRate!==""&&s.stateRate!==undefined&&!isNaN(+s.stateRate))?+s.stateRate:st[2];
  const stDed=extra.ded?extra.ded[s.filing==="mfj"?1:0]:0, stOt=extra.ot?Math.min(otPay,extra.ot):0;
  const state=Math.max(0,agi-stDed-stOt)*stRate/100;
  const net=gross-k401-ins-federal-ss-med-state;
  return {gross,k401,ins,federal,ss,med,state,stRate,net,otDed,hours:h*52,fedTaxable};
}
function weeklyNet(s,h){
  if(!(+s.wage)||h<=0)return 0;
  if(s.useStub&&+s.stubGross>0&&+s.stubNet>0)return weeklyGross(+s.wage,h)*(+s.stubNet/+s.stubGross);
  return annualCalc(s,h).net/52;
}
function realHourly(s,h){h=h||+s.hours||40;return h>0?weeklyNet(s,h)/h:0}

/* Debts: balance, apr, min, plus optional promo (months of 0% left), defer (no payment due during promo),
   fund (cash already set aside, applied before interest starts), prep (monthly set-aside during promo). */
function simulate(debts,strategy,extra,usePrep=true){
  const ds=debts.map(d=>({id:d.id,apr:+d.apr||0,min:+d.min||0,bal:Math.max(0,(+d.balance||0)-(+d.fund||0)),promo:+d.promo||0,defer:!!d.defer,prep:usePrep?(+d.prep||0):0})).filter(d=>d.bal>.005);
  const payoff={};if(!ds.length)return{months:0,interest:0,payoff,stuck:false};
  let m=0,interest=0;
  while(ds.some(d=>d.bal>.005)&&m<600){m++;
    const inPromo=d=>m<=d.promo,due=d=>inPromo(d)&&d.defer?0:d.min;
    let avail=(+extra||0)+ds.reduce((a,d)=>a+due(d),0);
    for(const d of ds)if(d.bal>0&&!inPromo(d)){const i=d.bal*d.apr/1200;d.bal+=i;interest+=i}
    for(const d of ds)if(d.bal>0&&inPromo(d)&&d.prep){d.bal-=Math.min(d.prep,d.bal)}
    for(const d of ds)if(d.bal>0){const p=Math.min(due(d),d.bal);d.bal-=p;avail-=p}
    const order=ds.filter(d=>d.bal>0).sort((a,b)=>(inPromo(a)-inPromo(b))||(strategy==="snowball"?a.bal-b.bal||b.apr-a.apr:b.apr-a.apr||a.bal-b.bal));
    for(const d of order){if(avail<=0)break;const p=Math.min(avail,d.bal);d.bal-=p;avail-=p}
    for(const d of ds)if(d.bal<=.005&&!payoff[d.id]){payoff[d.id]=m;d.bal=0}
  }
  return{months:m,interest,payoff,stuck:m>=600};
}

   (yearly profit after expenses) adds on top of the job. SE tax = 15.3% of 92.35% of profit (Social Security part
   only up to the wage base left after job wages); half of it is deductible; 20% QBI deduction (assumes income under the
   ~$200k phase-in). Not owed below $400 profit a year. */

  if(!(gn>0))return{fed:0,se:0,state:0};
  const a=annualCalc(s,h),f=FED[s.filing]||FED.single;
  const seBase=gn>=400?gn*.9235:0,w2=Math.max(0,a.gross-a.ins),ssRoom=Math.max(0,SS_BASE-w2);
  const seCore=Math.min(seBase,ssRoom)*.124+seBase*.029;
  const se=seCore+(Math.max(0,w2+seBase-f.addlMed)-Math.max(0,w2-f.addlMed))*.009;

  let lo=0,hi=debts.reduce((a,d)=>a+Math.max(0,(+d.balance||0)-(+d.fund||0)),0)+1;

  note.textContent=st[1]==="none"?`${st[0]} has no state income tax on wages.`:st[1]==="flat"?(f.state==="GA"?"Georgia: flat 4.99% for 2026, with up to $1,750 of overtime excluded.":`${st[0]}: flat rate. Check it against your paystub.`):`${st[0]} uses brackets. This is a rough effective rate; type your own or calibrate.`;
  if(!(+f.wage>0)){el.innerHTML=`<div class="empty">Enter your wage to see your real hourly pay.</div>`;return}
  const a=annualCalc(f,+f.hours),rh=realHourly(f,+f.hours),stub=f.useStub&&+f.stubGross>0&&+f.stubNet>0;
  const L=(k,v,cls="")=>`<div class="tl ${cls}"><span>${k}</span><b>${v}</b></div>`;
  el.innerHTML=L("Gross pay",money0(a.gross))+(a.k401?L("401(k)","−"+money0(a.k401)):"")+(a.ins?L("Insurance","−"+money0(a.ins)):"")+
    L("Federal income tax","−"+money0(a.federal))+L("Social Security + Medicare","−"+money0(a.ss+a.med))+L(`State (${a.stRate}%)`,"−"+money0(a.state))+
    L("Take-home",money0(a.net),"tot")+L("Real hourly wage",money(a.net/a.hours),"tot")+
    (stub?`<div class="tl tot"><span>Paystub-calibrated wage</span><b>${money(rh)}</b></div>`:"")+
    `<p class="hint" style="margin:10px 0 0">${a.otDed?`Includes ${money0(a.otDed)} federal overtime deduction (claimed at tax time). `:""}Estimate only, not tax advice. Local taxes and credits aren't included.</p>`}

let selCat="dining";
let sheetMode="spend";

  const sh=document.getElementById("sheet"),sc=document.getElementById("scrim");

    sh.innerHTML=`<div class="grab"></div>${seg}<form novalidate data-form="gig">
    <div class="amt-in"><span>$</span><input id="gigAmt" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-label="Amount received"></div>
    <div class="tgt" id="gigLive" style="margin-top:6px"><p class="hint" style="margin:0">Enter what you were paid. Clocked works out the tax on top of your job and what you keep.</p></div>

    </div>

    <div class="btns" style="margin-top:14px"><button type="button" class="btn ghost" data-act="close-add" style="flex:1">Cancel</button><button class="btn save" style="flex:2">Log income</button></div>
    </form>`;
  }else if(sheetMode==="biz"){
    sh.innerHTML=`<div class="grab"></div>${seg}<form novalidate data-form="biz">
    <div class="amt-in" id="bizAmtWrap"><span id="bizUnit">$</span><input id="bizAmt" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-label="Amount"></div>
    <div class="live-hrs" id="bizLive">Business costs lower the tax on your side income</div>

    <div class="form"><div class="field"><label for="bizNote">What was it?</label><input id="bizNote" placeholder="Optional" autocomplete="off"></div><div class="field"><label for="bizDate">Date</label><input id="bizDate" type="date" value="${today()}" max="${today()}"></div></div>
    <p class="hint" style="margin:8px 0 0">Only the business share counts. Personal use doesn't. Keep receipts.</p>
    <div class="btns" style="margin-top:14px"><button type="button" class="btn ghost" data-act="close-add" style="flex:1">Cancel</button><button class="btn primary" style="flex:2">Log expense</button></div>
    </form>`;
    setTimeout(bizPreview,0);
  }else sh.innerHTML=`<div class="grab"></div>${seg}<form novalidate data-form="tx">
    <div class="amt-in"><span>$</span><input id="txAmt" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-label="Amount"></div>

    <div class="cats">
      <div class="eyebrow">Needs</div><div class="grp">${Object.entries(CATS.need).map(([k,v])=>`<button type="button" class="cat need ${selCat===k?"on":""}" data-cat="${k}">${v}</button>`).join("")}</div>

let selBiz="supplies";
function bizPreview(){const el=document.getElementById("bizLive");if(!el)return null;const mi=selBiz==="mileage";
  document.getElementById("bizUnit").textContent=mi?"mi":"$";document.getElementById("bizAmt").placeholder=mi?"0":"0.00";
  const v=toNum(document.getElementById("bizAmt").value);if(!(v>0)){el.textContent=mi?`Miles driven for business · ${Math.round(MILE_RATE*1000)/10}¢ a mile`:"Business costs lower the tax on your side income";return null}
  const ded=mi?v*MILE_RATE:selBiz==="meals"?v*.5:v,a=mi?0:v,s=SU(),y=(document.getElementById("bizDate").value||today()).slice(0,4);
  const base=gigProfitYTD(y),save=gigTaxTotal(s,+s.hours||40,base).fed+gigTaxTotal(s,+s.hours||40,base).se+gigTaxTotal(s,+s.hours||40,base).state-(()=>{const t=gigTaxTotal(s,+s.hours||40,Math.max(0,base-ded));return t.fed+t.se+t.state})();
  el.textContent=`Deduct ${money(ded)}${save>=.01?` · saves about ${money(save)} in tax`:base>0?"":" · lowers tax once you log side income"}`;
  return{a:Math.round(a*100)/100,ded:Math.round(ded*100)/100,miles:mi?v:0}}
function gigPreview(){const el=document.getElementById("gigLive");if(!el)return null;
  const a=toNum(document.getElementById("gigAmt").value),x=toNum(document.getElementById("gigExp").value)||0;
  if(!(a>0)){el.innerHTML=`<p class="hint" style="margin:0">Enter what you were paid. Clocked works out the tax on top of your job and what you keep.</p>`;return null}
  const s=SU(),d=document.getElementById("gigDate").value||today(),y=d.slice(0,4),ytd=gigProfitYTD(y);
  const net=Math.max(0,a-x),t=gigTaxFor(s,+s.hours||40,ytd,net),kept=a-t.total,rh=realHourly(s,thisWeekHours());
  el.innerHTML=`<div class="tgt-big"><span class="mono" style="color:var(--save)">${money(kept)}</span><small>you keep · ${a?Math.round(t.total/a*100):0}% goes to tax${rh?` · same as ${hrs(kept/rh)} at your job`:""}</small></div>
    <div class="tax" style="margin-top:8px">
      <div class="tl"><span>Federal income tax</span><b>${money(t.fed)}</b></div>
      <div class="tl"><span>Self-employment tax</span><b>${money(t.se)}</b></div>
      <div class="tl"><span>State tax (${annualCalc(s,+s.hours||40).stRate}%)</span><b>${money(t.state)}</b></div>
      <div class="tl tot"><span>Set aside for taxes</span><b style="color:var(--want)">${money(t.total)}</b></div>
    </div>${ytd+net<400&&net>0?`<p class="hint" style="margin:6px 0 0">Self-employment tax starts once side profit passes $400 this year.</p>`:""}`;
  return{a,x,net,t,kept,d}}
function closeAdd(){const sh=document.getElementById("sheet"),sc=document.getElementById("scrim");sh.classList.remove("show");sc.classList.remove("show");setTimeout(()=>{sh.hidden=true;sc.hidden=true},320)}
function liveHrs(){const a=toNum(document.getElementById("txAmt").value),el=document.getElementById("liveHrs");if(!el)return;const rh=realHourly(SU(),thisWeekHours());
  if(!(a>0)||!rh){el.textContent="Each dollar is time on the clock";return}
  const h=a/rh,mins=Math.round(h*60);el.textContent=`= ${h>=1?h.toFixed(1)+" hours":mins+" minutes"} of work`+(catType(selCat)==="want"?` · fun tax ${money(a*SU().funTaxPct/100)}`:"")}

function addTx(a,c,n,d){const p=P(),m=monthKey(d);const t={id:uid(),d,c,a:Math.round(a*100)/100,n:n.slice(0,80),ts:Date.now()};
  (S.tx[m]=S.tx[m]||[]).push(t);if(!p.months.includes(m))p.months.push(m),p.months.sort();
  let msg;const rh=realHourly(SU(),thisWeekHours())||1;
  if(catType(c)==="want"){const tax=t.a*SU().funTaxPct/100;p.funTaxOwed=Math.round((p.funTaxOwed+tax)*100)/100;stamp(`−${hrs(t.a/rh)}`,"var(--want)");msg=tax>0?`Fun tax +${money(tax)} owed to savings`:"Logged"}
  else{stamp(`${hrs(t.a/rh)}`,"var(--need)");msg="Logged"}
  touchDay(today());award("first","First log");markDirty(m);closeAdd();render();setTimeout(()=>toast(msg),300)}

document.addEventListener("click",e=>{
  const tab=e.target.closest("[data-tab]");if(tab){S.tab=tab.dataset.tab;render();scrollTo({top:0});return}
  const bc=e.target.closest("[data-bizcat]");if(bc){selBiz=bc.dataset.bizcat;document.querySelectorAll("[data-bizcat]").forEach(x=>x.classList.toggle("on",x===bc));bizPreview();return}
  const cat=e.target.closest("[data-cat]");if(cat){selCat=cat.dataset.cat;document.querySelectorAll(".cat").forEach(x=>x.classList.toggle("on",x===cat));liveHrs();return}
  const el=e.target.closest("[data-act]");if(!el)return;const act=el.dataset.act,id=el.dataset.id,p=S.profile;
  if(act==="open-add")return openAdd();
  if(act==="status")return openStatus();
  if(act==="sheetmode"){const keep=(document.getElementById("txAmt")||document.getElementById("gigAmt")||document.getElementById("bizAmt"))?.value||"";sheetMode=el.dataset.v;openAdd();
    const i=document.getElementById(sheetMode==="gig"?"gigAmt":sheetMode==="biz"?"bizAmt":"txAmt");if(i&&keep){i.value=keep;sheetMode==="gig"?gigPreview():sheetMode==="biz"?bizPreview():liveHrs()}return}
  if(act==="savenow"){if(S.sample){toast("Nothing to save yet.");return}retries=0;dirty.profile=true;Object.keys(S.tx).forEach(m=>dirty.months.add(m));saveLocal();
    if(!DB&&IN_CLAUDE()){connect().then(()=>{flush().then(()=>{openStatus();toast(DB&&!syncErr?"Saved":"Saved on this phone")})});return}
    if(!DB){saveLocal();idbSave(true).then(()=>{openStatus();toast(lsOK||idbOK?"Saved on this phone":"This browser won't save. Check Private Browsing.")});return}
    flush().then(()=>{openStatus();toast(syncErr?"Save failed: "+(lastErr?.code||"error"):"Saved")});return}
  if(act==="copybackup"){const txt=JSON.stringify({clocked:1,profile:S.profile,tx:S.tx});const ta=document.getElementById("restoreTxt");
    const fallback=()=>{ta.value=txt;ta.focus();ta.select();toast("Backup is in the box. Copy it from there.")};
    try{navigator.clipboard.writeText(txt).then(()=>toast("Backup copied. Paste it in Notes to keep it."),fallback)}catch(_){fallback()}return}
  if(act==="restore"){restoreFrom(document.getElementById("restoreTxt").value);return}
  if(act==="restorepre"){if(!el.dataset.armed){el.dataset.armed=1;el.textContent="Tap again to replace current data";el.classList.add("danger");return}
    let t=null;try{t=localStorage.getItem(PRE_KEY)}catch(_){}if(t)restoreFrom(t);return}
  if(act==="backupfile"){if(S.sample){toast("Nothing to back up yet.");return}saveBackupFile();return}
  if(act==="hidewarn"){warnHidden=true;try{localStorage.setItem("clocked.warnHide",String(Date.now()+3*864e5))}catch(_){}render();return}
  if(act==="close-add")return closeAdd();
  if(act==="go-setup"){S.tab="setup";render();return}
  if(S.sample&&act!=="strat"&&act!=="paymode"){S.tab="setup";render();toast("Set up your numbers first.");return}
  if(act==="hrs"){const k=weekStart(today());p.hoursByWeek[k]=Math.max(0,Math.min(100,thisWeekHours()+ +el.dataset.d));
    const keys=Object.keys(p.hoursByWeek).sort();if(keys.length>60)delete p.hoursByWeek[keys[0]];markDirty();render();return}
  if(act==="nospend"){const t=today();if(!p.noSpendDays.includes(t))p.noSpendDays.push(t);p.noSpendDays=p.noSpendDays.slice(-120);touchDay(t);
    stamp("NO SPEND","var(--save)");if(p.noSpendDays.length>=5)award("ns5","5 no-spend days");markDirty();render();return}
  if(act==="paytax"){const dst=ftDest();if(!dst||p.funTaxOwed<=0)return;
    const amt=p.funTaxOwed,o=dst.obj;
    if(dst.kind==="goal"){o.saved=Math.round((+o.saved+amt)*100)/100;if(!SU().funTaxGoal)SU().funTaxGoal=o.id;if(+o.saved>=+o.target)award("goal","Goal reached")}
    else{o.fund=Math.round(Math.min(+o.balance,(+o.fund||0)+amt)*100)/100}
    p.funTaxPaid=Math.round((p.funTaxPaid+amt)*100)/100;p.funTaxOwed=0;stamp(`+${money(amt)}`,"var(--save)");confetti(70);
    if(p.funTaxPaid>=50)award("ft50","$50 fun tax saved");markDirty();render();return}
  if(act==="applyfund"){const d=p.debts.find(d=>d.id===id);if(!d||!(+d.fund>0))return;
    if(!el.dataset.armed){el.dataset.armed=1;el.textContent="Tap again once you've paid it";return}
    const a=+d.fund;d.balance=Math.max(0,Math.round((+d.balance-a)*100)/100);d.fund=0;
    if(d.prepTarget!==""&&d.prepTarget!=null)d.prepTarget=Math.max(0,Math.round((+d.prepTarget-a)*100)/100);
    if(d.balance===0){stamp("PAID OFF","var(--save)");confetti(180);award("debt","Debt paid off")}else stamp(`−${money0(a)}`,"var(--debt)");markDirty();render();return}
  if(act==="paymode"){p.payMode=el.dataset.v;markDirty();render();return}
  if(act==="usetgt"){const m=+el.dataset.m,x=+el.dataset.x;const d=addMonths(m);d.setDate(28);p.targetDate=ymd(d);p.extra=x;markDirty();render();
    stamp(fmtMonth(addMonths(m)),"var(--debt)");toast(`Plan set: ${money0(x)} extra/month`);return}
  if(act==="delbiz"){if(!el.classList.contains("confirm")){el.classList.add("confirm");el.textContent="Delete";setTimeout(()=>{if(el.isConnected){el.classList.remove("confirm");el.textContent="×"}},3000);return}
    p.bizExp=(p.bizExp||[]).filter(x=>x.id!==id);markDirty();render();return}
  if(act==="delgig"){if(!el.classList.contains("confirm")){el.classList.add("confirm");el.textContent="Delete";setTimeout(()=>{if(el.isConnected){el.classList.remove("confirm");el.textContent="×"}},3000);return}
    const g=(p.gigs||[]).find(g=>g.id===id);if(!g)return;const [k,did]=(g.dest||"week").split(":");
    if(k==="goal"){const o=p.goals.find(x=>x.id===did);if(o)o.saved=Math.max(0,Math.round((+o.saved-g.kept)*100)/100)}
    if(k==="debt"){const o=p.debts.find(x=>x.id===did);if(o)o.balance=Math.round((+o.balance+g.kept)*100)/100}
    if(k==="fund"){const o=p.debts.find(x=>x.id===did);if(o)o.fund=Math.max(0,Math.round(((+o.fund||0)-g.kept)*100)/100)}
    p.gigs=p.gigs.filter(x=>x.id!==id);markDirty();render();return}
  if(act==="ftdebt"){SU().funTaxGoal="debt:"+id;markDirty();render();toast("Fun tax now goes to this debt's set-aside");return}
  if(act==="deltx"){if(!el.classList.contains("confirm")){el.classList.add("confirm");el.textContent="Delete";setTimeout(()=>{if(el.isConnected){el.classList.remove("confirm");el.textContent="×"}},3000);return}
    for(const m of Object.keys(S.tx)){const i=S.tx[m].findIndex(t=>t.id===id);if(i>-1){const t=S.tx[m][i];S.tx[m].splice(i,1);
      if(catType(t.c)==="want")p.funTaxOwed=Math.max(0,Math.round((p.funTaxOwed-t.a*SU().funTaxPct/100)*100)/100);markDirty(m);break}}render();return}
  if(act==="strat"){if(S.sample){p.strategy=el.dataset.v;render();return}p.strategy=el.dataset.v;markDirty();render();return}
  if(act==="deldebt"||act==="delgoal"){if(!el.dataset.armed){el.dataset.armed=1;el.textContent="Tap again to delete";el.classList.add("danger");return}
    if(act==="deldebt"){p.debts=p.debts.filter(d=>d.id!==id);if(SU().funTaxGoal==="debt:"+id)SU().funTaxGoal=p.goals[0]?.id||null}else{p.goals=p.goals.filter(g=>g.id!==id);if(SU().funTaxGoal===id)SU().funTaxGoal=p.goals[0]?.id||null}markDirty();render();return}
  if(act==="ftgoal"){SU().funTaxGoal=id;markDirty();render();toast("Fun tax now goes to this goal");return}
  if(act==="reset"){if(!el.dataset.armed){el.dataset.armed=1;el.textContent="Tap again to erase all data";el.classList.add("danger");return}
    const months=Object.keys(S.tx);S.profile=blankProfile();S.tx={};try{localStorage.removeItem(LS)}catch(_){}
    if(DB&&UID){(async()=>{try{await DB.doc(`data/users/${UID}/profile`).delete();for(const m of months)await DB.doc(`data/users/${UID}/tx-${m}`).delete()}catch(_){}})()}
    const s=sampleState();S.profile=s.profile;S.tx=s.tx;S.sample=true;S.tab="setup";render();toast("Erased.");return}

let formBusy=false;
function handleForm(f){if(!f||formBusy)return;formBusy=true;setTimeout(()=>formBusy=false,350);try{runForm(f)}catch(err){toast("Something went wrong: "+(err&&err.message||err))}}
function runForm(f){const kind=f.dataset.form,p=S.profile,num=id=>toNum(document.getElementById(id)?.value);
  if(kind==="setup"){const s=readSetupForm();if(!(+s.wage>0)){toast("Enter your hourly wage.");return}
    const essIn=readEss();if(S.sample){const fresh=blankProfile();S.profile=fresh;S.tx={};S.sample=false}
    if(essIn)S.profile.setup.ess=essIn;
    const was=S.profile.setup.funTaxGoal;Object.assign(S.profile.setup,s,{funTaxGoal:was});award("setup","Set up");markDirty();S.tab="today";render();scrollTo({top:0});stamp(money(realHourly(SU()))+"/h","var(--accent)");return}
  if(S.sample){S.tab="setup";render();toast("Set up your numbers first.");return}
  if(kind==="gig"){const r=gigPreview();if(!r){toast("Enter what you were paid.");return}
    const dest=document.getElementById("gigDest").value||"week",note=document.getElementById("gigNote").value.trim();
    const R=v=>Math.round(v*100)/100,g={id:uid(),d:r.d,a:R(r.a),x:R(r.x),n:note.slice(0,80),dest,kept:R(r.kept),tax:{fed:R(r.t.fed),se:R(r.t.se),state:R(r.t.state),total:R(r.t.total)},ts:Date.now()};
    if(!p.gigs)p.gigs=[];p.gigs.push(g);
    const [k,did]=dest.split(":");
    if(k==="goal"){const o=p.goals.find(x=>x.id===did);if(o){const b=+o.saved;o.saved=R(b+g.kept);if(b<+o.target&&o.saved>=+o.target)award("goal","Goal reached")}}
    if(k==="debt"){const o=p.debts.find(x=>x.id===did);if(o){o.balance=Math.max(0,R(+o.balance-g.kept));if(o.balance===0)award("debt","Debt paid off")}}
    if(k==="fund"){const o=p.debts.find(x=>x.id===did);if(o)o.fund=R(Math.min(+o.balance,(+o.fund||0)+g.kept))}
    touchDay(today());markDirty();closeAdd();render();stamp("+"+money0(g.kept),"var(--save)");confetti(90);
    setTimeout(()=>toast(`Set aside ${money(g.tax.total)} for taxes`),400);return}
  if(kind==="biz"){const r=bizPreview();if(!r){toast(selBiz==="mileage"?"Enter the miles you drove.":"Enter the amount.");return}
    const x={id:uid(),d:document.getElementById("bizDate").value||today(),c:selBiz,a:r.a,ded:r.ded,miles:r.miles,n:document.getElementById("bizNote").value.trim().slice(0,80),ts:Date.now()};
    if(!Array.isArray(p.bizExp))p.bizExp=[];p.bizExp.push(x);touchDay(today());markDirty();closeAdd();render();stamp("−"+money0(x.ded),"var(--debt)");
    setTimeout(()=>toast(`Business expense logged · ${money(x.ded)} deductible`),400);return}
  if(kind==="gigtax"){const a=num("gigTaxPay");if(!(a>0))return;const y=yr();if(!p.gigTaxPaid||Array.isArray(p.gigTaxPaid))p.gigTaxPaid={};p.gigTaxPaid[y]=Math.round(((+p.gigTaxPaid[y]||0)+a)*100)/100;markDirty();render();toast("Tax payment logged");return}
  if(kind==="tx"){const a=num("txAmt");if(!(a>0)){toast("Enter an amount.");return}addTx(a,selCat,document.getElementById("txNote").value.trim(),document.getElementById("txDate").value||today());return}
  if(kind==="debt"){const n=document.getElementById("dn").value.trim(),b=num("db"),a0=num("da"),is=document.getElementById("dis").value,pt=num("dpt"),fd=num("dfd")||0,df=document.getElementById("ddf").checked;
    const later=!!is&&is>today();let m=num("dm");if(isNaN(m)&&later)m=0;const a=isNaN(a0)&&later?0:a0;
    const miss=[!n&&"name",!(b>0)&&"balance",!(a>=0)&&"APR",!(m>=0)&&"minimum payment",(m===0&&!later)&&"a minimum above $0 (or an interest start date)"].filter(Boolean);
    if(miss.length){toast("Add "+miss.join(", ")+".");return}
    const d={id:uid(),name:n.slice(0,40),balance:b,start:b,apr:a,min:m,fund:Math.min(fd,b)};
    if(later){d.intStart=is;d.defer=df;d.prepTarget=pt>0?Math.min(pt,b):""}
    p.debts.push(d);if(later&&!p.goals.length&&!SU().funTaxGoal)SU().funTaxGoal="debt:"+d.id;
    markDirty();render();toast(later?`0% until ${fmtMonth(parse(is))}. Set-aside plan ready.`:"Debt added. Here's your plan.");return}
  if(kind==="fund"){const d=p.debts.find(d=>d.id===f.dataset.id),a=num("fund-"+f.dataset.id);if(!d||!(a>0))return;
    const before=+d.fund||0;d.fund=Math.round(Math.min(+d.balance,before+a)*100)/100;touchDay(today());stamp(`+${money0(a)}`,"var(--save)");
    if(before<prepTarget(d)&&d.fund>=prepTarget(d)){confetti(160);toast("Fully covered before interest starts.")}markDirty();render();return}
  if(kind==="pay"){const d=p.debts.find(d=>d.id===f.dataset.id),a=num("pay-"+f.dataset.id);if(!d||!(a>0))return;
    d.balance=Math.max(0,Math.round((+d.balance-a)*100)/100);touchDay(today());
    if(d.balance===0){stamp("PAID OFF","var(--save)");confetti(180);award("debt","Debt paid off")}else{stamp(`−${money0(a)}`,"var(--debt)")}markDirty();render();return}
  if(kind==="goal"){const n=document.getElementById("gn").value.trim(),t=num("gt"),s=num("gs")||0,d=document.getElementById("gd").value;if(!n||!(t>0)||!d){toast("Fill in a name, target and date.");return}
    const g={id:uid(),name:n.slice(0,40),target:t,saved:s,date:d};p.goals.push(g);if(!SU().funTaxGoal)SU().funTaxGoal=g.id;markDirty();render();toast("Goal added.");return}
  if(kind==="addsave"){const g=p.goals.find(g=>g.id===f.dataset.id),a=num("as-"+f.dataset.id);if(!g||!(a>0))return;
    const before=+g.saved;g.saved=Math.round((before+a)*100)/100;stamp(`+${money0(a)}`,"var(--save)");
    if(before<+g.target&&g.saved>=+g.target){confetti(200);award("goal","Goal reached")}markDirty();render();return}
}

function afterLoad(){autoFreeze();render()}
function animateRings(){document.querySelectorAll(".ring .val[data-off]").forEach(c=>{requestAnimationFrame(()=>requestAnimationFrame(()=>c.style.strokeDashoffset=c.dataset.off))})}
const _render=render;render=function(){_render();animateRings()};

/* boot */
(function boot(){const l=loadLocal();if(l){snapshotOld(l);S.profile=hydrate(l.profile);S.tx=l.tx||{};S.sample=false;S.localPending=!!l.pending}
  else{const s=sampleState();S.profile=s.profile;S.tx=s.tx;S.sample=true}
  if(!S.sample)askPersist();afterLoad();idbRecover().finally(connect)})();
async function idbRecover(){try{const r=await idbGet();idbOK=true;if(!r||!r.profile){if(!S.sample)idbSave();return}
  const lu=S.sample?-1:(S.profile.updated||0),ru=r.profile.updated||0;
  if(ru>lu){snapshotOld(r);S.profile=hydrate(r.profile);S.tx=thaw(r.tx||{});S.sample=false;
    try{localStorage.setItem(LS,JSON.stringify({profile:S.profile,tx:S.tx}));lsOK=true}catch(_){lsOK=false}afterLoad()}
  else if(ru<lu)idbSave();setSync()}catch(e){idbOK=false;setSync()}}
</script>
